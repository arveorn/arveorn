<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Arveorn</title>
    <meta name="theme-color" content="#1a1d1f">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-heading: 'Bodoni Moda', serif;
            --font-body: 'EB Garamond', serif;
            --white: #ffffff;
            --white-70: rgba(255, 255, 255, 0.7);
            --white-40: rgba(255, 255, 255, 0.4);
            --bg-base: #1a1d1f;
            --transition-smooth: 0.3s ease;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font-body);
            font-size: 18px;
            font-weight: 400;
            color: var(--white);
            background: var(--bg-base);
            line-height: 1.7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .notfound { max-width: 640px; width: 100%; }
        .notfound-code {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: clamp(90px, 18vw, 180px);
            letter-spacing: 12px;
            line-height: 1;
            color: var(--white);
            margin-bottom: 20px;
        }
        .notfound-title {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: clamp(16px, 2.4vw, 22px);
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--white-70);
            margin-bottom: 40px;
        }
        .notfound-text {
            font-size: 18px;
            color: var(--white-70);
            margin-bottom: 50px;
            line-height: 1.8;
        }
        .notfound-link {
            display: inline-block;
            font-family: var(--font-heading);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--white);
            border: 1px solid var(--white-40);
            padding: 16px 45px;
            text-decoration: none;
            transition: all var(--transition-smooth);
        }
        .notfound-link:hover { background: var(--white); color: var(--bg-base); border-color: var(--white); }
        @media (max-width: 480px) {
            .notfound-code { letter-spacing: 6px; }
            .notfound-title { letter-spacing: 4px; }
            .notfound-text { font-size: 16px; }
            .notfound-link { padding: 14px 32px; font-size: 12px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>
    <div class="notfound">
        <h1 class="notfound-code">404</h1>
        <p class="notfound-title">Page Not Found</p>
        <p class="notfound-text">
            The page you're looking for doesn't exist<br>
            or has been moved.
        </p>
        <a href="/" class="notfound-link">&larr; Back to Home</a>
    </div>
</body>
</html>
